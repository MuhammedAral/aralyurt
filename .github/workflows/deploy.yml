name: Deploy to FTP

on:
  push:
    branches:
      - main # main dalına (branch) her kod gönderildiğinde çalışır

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3

    - name: Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Sunucudaki hedef klasör (FileZilla'daki yol)
        server-dir: /domains/aralyurt.com/public_html/
